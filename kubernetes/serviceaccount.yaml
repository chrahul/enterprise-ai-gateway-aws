# ServiceAccount: litellm-sa
# Provides the LiteLLM pod with an AWS IAM identity via IRSA
# (IAM Roles for Service Accounts).
#
# Prerequisites before deploying:
#   1. EKS cluster must have an OIDC provider configured.
#      aws eks describe-cluster --name CLUSTER_NAME --query "cluster.identity.oidc.issuer"
#
#   2. Create an IAM role with a trust policy referencing this ServiceAccount:
#      Principal: oidc.eks.REGION.amazonaws.com/id/OIDC_ID
#      Condition: StringEquals sub = system:serviceaccount:ai-gateway:litellm-sa
#
#   3. Attach IAM policies to the role:
#      - AmazonBedrockFullAccess (or a least-privilege custom policy scoped to required models)
#      - A policy granting secretsmanager:GetSecretValue on the LiteLLM secrets path
#
#   4. Replace ACCOUNT_ID, REGION, and ROLE_NAME below with actual values.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-sa
  namespace: ai-gateway
  labels:
    app: litellm
    app.kubernetes.io/name: litellm-sa
    app.kubernetes.io/part-of: enterprise-ai-gateway
    app.kubernetes.io/managed-by: kubectl
  annotations:
    # TODO: Replace with the actual IAM role ARN created for LiteLLM IRSA.
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/ROLE_NAME"
    # Optional: set to "true" to disable automatic token mounting for other pods
    # eks.amazonaws.com/token-expiration: "86400"
automountServiceAccountToken: true
