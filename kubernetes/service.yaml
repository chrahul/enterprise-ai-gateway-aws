# Service: litellm
# ClusterIP service exposing the LiteLLM proxy on port 4000.
# The Ingress and internal consumers reference this service.
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai-gateway
  labels:
    app: litellm
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: enterprise-ai-gateway
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 4000