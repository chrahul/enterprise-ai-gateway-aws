# Ingress: litellm-ingress
# AWS Load Balancer Controller provisioned ALB.
# Prerequisites:
#   - AWS Load Balancer Controller must be installed on the EKS cluster.
#   - ACM certificate ARN must be set in the annotation below.
#   - Replace PLACEHOLDER_DOMAIN with the actual Route 53 / DNS hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-ingress
  namespace: ai-gateway
  labels:
    app: litellm
    app.kubernetes.io/name: litellm-ingress
    app.kubernetes.io/part-of: enterprise-ai-gateway
    app.kubernetes.io/managed-by: kubectl
  annotations:
    # ALB scheme: internet-facing exposes the ALB publicly.
    # Use 'internal' for private VPC-only access.
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Target type 'ip' is required for AWS VPC CNI pod networking.
    alb.ingress.kubernetes.io/target-type: ip
    # HTTPS listener on port 443.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    # TODO: Replace with the ACM certificate ARN for the gateway domain.
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERTIFICATE_ID"
    # SSL policy — use a current TLS policy.
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    # Health check configuration aligned with LiteLLM /health endpoint.
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    # Enable access logs to S3 for audit and cost attribution.
    # alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=BUCKET_NAME
spec:
  rules:
    # TODO: Replace PLACEHOLDER_DOMAIN with the actual gateway hostname.
    - host: ai-gateway.PLACEHOLDER_DOMAIN.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  number: 80