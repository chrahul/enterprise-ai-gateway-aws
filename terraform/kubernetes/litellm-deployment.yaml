apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      serviceAccountName: litellm-sa

      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-stable

        ports:
        - containerPort: 4000

        env:
        - name: AWS_REGION
          value: us-east-1

        - name: LITELLM_MASTER_KEY
          value: change-me

        volumeMounts:
        - name: config-volume
          mountPath: /app/config.yaml
          subPath: config.yaml

      volumes:
      - name: config-volume
        configMap:
          name: litellm-config