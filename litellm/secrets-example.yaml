# ─────────────────────────────────────────────────────────────────────────────
# LiteLLM Secrets — Example Structure
# ─────────────────────────────────────────────────────────────────────────────
#
# DO NOT commit real credentials in this file.
# This file documents the expected secret structure only.
#
# In production, these values are stored as a JSON object in AWS Secrets Manager
# at path: ai-gateway-{env}/litellm-secrets
# and accessed via IRSA (see 95-irsa-and-iam-design.md).
#
# The Kubernetes Secret is created with:
#   kubectl create secret generic litellm-secrets \
#     --namespace ai-gateway \
#     --from-literal=master-key="sk-your-master-key-here"
#
# AWS Secrets Manager JSON structure (for reference):
# {
#   "LITELLM_MASTER_KEY": "sk-...",
#   "OPENAI_API_KEY": "sk-...",          (optional — only if OpenAI is enabled)
#   "ANTHROPIC_API_KEY": "sk-ant-...",   (optional — only if direct Anthropic API is enabled)
#   "LANGFUSE_PUBLIC_KEY": "pk-lf-...",  (optional — only if Langfuse is enabled)
#   "LANGFUSE_SECRET_KEY": "sk-lf-..."   (optional — only if Langfuse is enabled)
# }
# ─────────────────────────────────────────────────────────────────────────────

LITELLM_MASTER_KEY: "sk-REPLACE-WITH-REAL-VALUE"

# Optional — only required if OpenAI models are added to config.yaml
OPENAI_API_KEY: "sk-REPLACE-WITH-REAL-VALUE"

# Optional — only required if Anthropic direct API (not Bedrock) is used
ANTHROPIC_API_KEY: "sk-ant-REPLACE-WITH-REAL-VALUE"

# Optional — only required when Langfuse observability is enabled
LANGFUSE_PUBLIC_KEY: "pk-lf-REPLACE-WITH-REAL-VALUE"
LANGFUSE_SECRET_KEY: "sk-lf-REPLACE-WITH-REAL-VALUE"

# Note: AWS credentials (for Bedrock) are NOT listed here.
# They are provided automatically by IRSA — no AWS_ACCESS_KEY_ID or
# AWS_SECRET_ACCESS_KEY should ever appear in this file or in the cluster.
